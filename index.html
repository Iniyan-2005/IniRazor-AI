    <title>IniRazorAI — AI Finance Controller</title>

    <!--
      Anti-flash theme script: runs synchronously BEFORE React hydrates.
      Reads localStorage, falls back to system preference.
      Adds the 'dark' class to <html> immediately if needed.
      This prevents a white flash in users who prefer dark mode.
    -->
    <script>
      (function () {
        var stored = localStorage.getItem('inirazor-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
